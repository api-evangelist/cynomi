aid: cynomi
name: Cynomi
description: >-
  Cynomi is an AI-powered, automated virtual CISO (vCISO) platform built for MSPs,
  MSSPs, and cybersecurity consultancies to deliver scalable security and
  compliance services to their clients. The platform automates risk assessments,
  generates tailored security policies and prioritized remediation plans, and maps
  controls to leading frameworks including NIST CSF, ISO 27001, SOC 2, PCI DSS,
  GDPR, NIS2, and HIPAA, tracking security posture over time. Cynomi exposes a
  platform-agnostic Public API for bi-directional task synchronization with any PSA
  or ticketing system (ConnectWise, ServiceNow, Autotask, HaloPSA, Kaseya, NinjaOne,
  Atera), pushing remediation tasks out and pulling status updates back, alongside
  pre-built integrations with vulnerability scanners (Tenable, Qualys, Rapid7,
  CrowdStrike, SentinelOne) and cloud security tools. Authentication is handled
  through an Auth0 tenant using OAuth 2.0 / OpenID Connect. Cynomi is backed by
  Canaan Partners and Insight Partners.
